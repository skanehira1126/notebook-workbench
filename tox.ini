[tox]
min_version = 4.25
env_list = py311, py312, py313, lint, codex

[testenv:py3{11,12,13}]
description = run the unit, domain, CLI, and plugin tests with coverage on Python {base_python}
package = wheel
deps =
    pytest>=8.3
    pytest-cov>=6
commands =
    pytest --cov=notebook_workbench --cov-report=term-missing --cov-fail-under=85 {posargs}

[testenv:lint]
description = run static checks
skip_install = true
deps =
    ruff>=0.12
commands =
    ruff check src tests

[testenv:codex]
description = run the official Codex skill and plugin validators
skip_install = true
deps =
    pyyaml>=6
set_env =
    CODEX_HOME = {env:CODEX_HOME:{env:HOME}/.codex}
commands =
    python {env:CODEX_HOME}/skills/.system/skill-creator/scripts/quick_validate.py skills/notebook-workbench
    python {env:CODEX_HOME}/skills/.system/skill-creator/scripts/quick_validate.py skills/notebook-data-analysis
    python {env:CODEX_HOME}/skills/.system/plugin-creator/scripts/validate_plugin.py .
