[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "notebook-workbench"
version = "0.3.0"
description = "Deterministic notebook editing and reproducible analysis workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Notebook Workbench contributors" }]
dependencies = [
  "ipykernel>=6.29,<8",
  "nbformat>=5.10,<6",
  "papermill>=2.6,<3",
  "pyyaml>=6,<7",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=6"]

[project.scripts]
notebook-workbench = "notebook_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_workbench"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "tox>=4.25",
]
